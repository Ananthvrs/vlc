
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamil IPTV Player</title>

<!-- HLS video playback support -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101116;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  background:#191b23;
  padding:16px;
  font-size:22px;
  font-weight:bold;
}
main{padding:14px;max-width:1100px;margin:auto}
video{
  width:100%;
  max-height:65vh;
  background:#000;
  border-radius:12px;
}
#nowname{font-size:20px;font-weight:bold;margin:12px 0 5px}
#status{color:#ffca6b;font-size:14px;margin:8px 0}
.controls{display:flex;gap:10px;margin:12px 0}
button{
  border:0;border-radius:8px;padding:11px 16px;
  background:#e50914;color:white;font-size:15px;
}
input{
  width:100%;padding:13px;border-radius:8px;
  border:1px solid #444;background:#20222b;
  color:white;margin:10px 0;
}
#channels{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:10px;
}
.channel{
  padding:14px;background:#20222b;border-radius:10px;
  cursor:pointer;overflow-wrap:anywhere;
}
.channel:hover{background:#343746}
.small{font-size:12px;color:#aaa}
</style>
</head>

<body>
<header>📺 Tamil IPTV Player</header>

<main>
  <video id="video" controls playsinline></video>
  <div id="nowname">ஒரு சேனலை தேர்வு செய்யவும்</div>
  <div id="status">Playlist ஏற்றப்படுகிறது…</div>

  <div class="controls">
    <button id="prev">⏮ Previous</button>
    <button id="next">Next ⏭</button>
  </div>

  <input id="search" placeholder="சேனல் தேடுங்கள்…">
  <div id="channels"></div>
</main>

<script>
const PLAYLIST =
  "https://iptv-org.github.io/iptv/languages/tam.m3u";

const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const channelsEl = document.getElementById("channels");

let channels = [];
let current = -1;
let hls = null;

function status(message){
  statusEl.textContent = message;
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const result = [];
  let name = "";

  for(const raw of lines){
    const line = raw.trim();

    if(line.startsWith("#EXTINF")){
      const match = line.match(/,(.*)$/);
      name = match ? match[1].trim() : "Unknown Channel";
    }else if(line && !line.startsWith("#") && name){
      result.push({name, url:line});
      name = "";
    }
  }

  return result;
}

function render(){
  const query = document.getElementById("search")
    .value.toLowerCase();

  channelsEl.innerHTML = "";

  channels.forEach((channel,index)=>{
    if(!channel.name.toLowerCase().includes(query)) return;

    const item = document.createElement("div");
    item.className = "channel";
    item.innerHTML =
      `<strong></strong><div class="small">Live TV</div>`;

    item.querySelector("strong").textContent = channel.name;
    item.onclick = ()=>play(index);

    channelsEl.appendChild(item);
  });
}

function play(index){
  if(index < 0 || index >= channels.length) return;

  current = index;
  const channel = channels[index];

  document.getElementById("nowname").textContent =
    channel.name;

  status("Stream திறக்கப்படுகிறது…");

  if(hls){
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  video.onerror = ()=>{
    status("Stream இயங்கவில்லை. Link expired, blocked அல்லது unsupported ஆக இருக்கலாம்.");
  };

  video.onplaying = ()=>{
    status("▶ Live stream இயங்குகிறது");
  };

  video.onwaiting = ()=>{
    status("Buffering…");
  };

  const isHLS = /\.m3u8($|[?#])/i.test(channel.url);

  if(isHLS && video.canPlayType("application/vnd.apple.mpegurl")){
    // Native HLS: iPhone / Safari
    video.src = channel.url;
    video.play().catch(()=>{
      status("Play அழுத்தி முயற்சிக்கவும்.");
    });

  }else if(isHLS && window.Hls && Hls.isSupported()){
    // HLS.js: compatible Chrome, Firefox, Edge
    hls = new Hls({
      enableWorker:true,
      lowLatencyMode:false,
      manifestLoadingTimeOut:20000,
      fragLoadingTimeOut:30000
    });

    hls.loadSource(channel.url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      video.play().catch(()=>{
        status("Stream தயார். Play அழுத்தவும்.");
      });
    });

    hls.on(Hls.Events.ERROR,(_event,data)=>{
      if(!data.fatal) return;

      if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
        status("Network error. மீண்டும் முயற்சிக்கிறது…");
        hls.startLoad();
      }else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
        status("Media error. சரிசெய்ய முயற்சிக்கிறது…");
        hls.recoverMediaError();
      }else{
        status("Stream திறக்கவில்லை. Link அல்லது server பிரச்சினையாக இருக்கலாம்.");
        hls.destroy();
        hls = null;
      }
    });

  }else{
    // Direct MP4 or other browser-supported media
    video.src = channel.url;
    video.load();
    video.play().catch(()=>{
      status("Play அழுத்தவும். இந்த format ஆதரிக்கப்படாமல் இருக்கலாம்.");
    });
  }

  render();
}

document.getElementById("prev").onclick = ()=>{
  if(current > 0) play(current-1);
};

document.getElementById("next").onclick = ()=>{
  if(current < channels.length-1) play(current+1);
};

document.getElementById("search").addEventListener("input",render);

async function loadPlaylist(){
  try{
    const response = await fetch(PLAYLIST);

    if(!response.ok) throw new Error("Playlist fetch failed");

    const text = await response.text();
    channels = parseM3U(text);

    // Popular movie and Tamil channels first
    const priority = [
      "Sony PIX","Star Movies","Sun TV","Zee Tamil",
      "KTV","Vijay TV","Star Vijay","Colors Tamil"
    ];

    channels.sort((a,b)=>{
      const ai = priority.findIndex(n=>
        a.name.toLowerCase().includes(n.toLowerCase()));
      const bi = priority.findIndex(n=>
        b.name.toLowerCase().includes(n.toLowerCase()));

      return (ai < 0 ? 999 : ai) -
             (bi < 0 ? 999 : bi);
    });

    render();
    status(channels.length + " சேனல்கள் ஏற்றப்பட்டன");

  }catch(error){
    status("Playlist ஏற்ற முடியவில்லை. Internet அல்லது CORS பிரச்சினை இருக்கலாம்.");
  }
}

loadPlaylist();
</script>
</body>
</html>
